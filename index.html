<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

          image: 'https://flipclass.stust.edu.tw/sysdata/attach/kexam.33220/kques.803651/170c88b1de04f088accedf4e131e18fc.png',
          type: 'radio',
          options: [
            { value: 'A', label: '由狀態A，經事件p，進入狀態F的子狀態F1。' },
            { value: 'B', label: '由狀態B，經事件q，進入狀態F的子狀態F2。' },
            { value: 'C', label: '在狀態F的子狀態F3，經事件r，進入狀態C。' },
            { value: 'D', label: '狀態F必須進入結束狀態後，且經事件s，才能進入狀態D。' }
          ],
          correct: 'D'
        },
        {
          id: 'q8',
          text: '關於底下的圖形，何者描述錯誤？',
          image: 'https://flipclass.stust.edu.tw/sysdata/attach/kexam.33220/kques.803652/44599e50c51b6e5c7b951754764178e9.png',
          type: 'radio',
          options: [
            { value: 'A', label: '「24小時出貨」與「一般出貨」二選一執行' },
            { value: 'B', label: '有設定責任區' },
            { value: 'C', label: '「發票處理」與「出貨處理」可同時執行' },
            { value: 'D', label: '「結束訂單」上面只要任何一方先完成，馬上就可執行「結束訂單」' }
          ],
          correct: 'D'
        },
        {
          id: 'q9',
          text: '附圖中的洗滌狀態是哪一種類型的狀態？',
          image: 'https://flipclass.stust.edu.tw/sysdata/attach/kexam.33220/kques.803653/032d042cbc6d75a259083890db685053.png',
          type: 'radio',
          options: [
            { value: 'A', label: '循序組合狀態' },
            { value: 'B', label: '同步組合狀態' },
            { value: 'C', label: '歷史狀態' },
            { value: 'D', label: '開始狀態' }
          ],
          correct: 'A'
        },
        {
          id: 'q10',
          text: '關於下圖，以下敘述何者錯誤？',
          image: 'https://flipclass.stust.edu.tw/sysdata/attach/kexam.33220/kques.803654/8a0312f90f5aacfa0a92c83627f1a53b.png',
          type: 'radio',
          options: [
            { value: 'A', label: '一進入洗滌狀態，即同時處在「攪拌式」與「低速」兩個子狀態' },
            { value: 'B', label: '一分鐘後，即同時處在「攪拌式」與「中速」兩個子狀態' },
            { value: 'C', label: '五分鐘後，即同時處在「離心力」與「中速」兩個子狀態' },
            { value: 'D', label: '同時進入「結束」子狀態' }
          ],
          correct: 'C'
        }
      ]
    };

    const quizSelect = document.getElementById('quiz-select');
    const quizContainer = document.getElementById('quiz');
    const submitButton = document.getElementById('submit');
    const totalResult = document.getElementById('total-result');

    function renderQuiz(quizKey) {
      quizContainer.innerHTML = '';
      totalResult.innerHTML = '';
      const questions = quizzes[quizKey];
      try {
        questions.forEach((q, index) => {
          const questionDiv = document.createElement('div');
          questionDiv.className = 'question';
          questionDiv.innerHTML = `
            <p>${index + 1}. ${q.text}</p>
            ${q.image ? `<img src="${q.image}" alt="UML Diagram"><br><a href="${q.image}" target="_blank">查看原始圖片</a>` : ''}
            ${q.options.map(option => `
              <label>
                <input type="${q.type}" name="${q.id}" value="${option.value}">
                ${option.value}. ${option.label}
              </label><br>
            `).join('')}
            <p id="result-${q.id}" class="result"></p>
          `;
          quizContainer.appendChild(questionDiv);
        });
      } catch (error) {
        console.error('題目生成失敗:', error);
        quizContainer.innerHTML = '<p style="color: red;">題目載入失敗，請檢查程式碼或瀏覽器設定。</p>';
      }
    }

    // 初始載入第一個測驗
    renderQuiz(quizSelect.value);

    // 當選擇測驗時重新渲染
    quizSelect.addEventListener('change', () => {
      renderQuiz(quizSelect.value);
    });

    // 提交答案
    submitButton.addEventListener('click', () => {
      const questions = quizzes[quizSelect.value];
      let score = 0;
      const total = questions.length;

      questions.forEach(q => {
        const resultElement = document.getElementById(`result-${q.id}`);
        if (q.type === 'checkbox') {
          const selected = Array.from(document.querySelectorAll(`input[name="${q.id}"]:checked`)).map(input => input.value);
          const correct = q.correct;
          if (selected.length === correct.length && selected.every(val => correct.includes(val))) {
            score++;
            resultElement.innerHTML = '<span class="correct">正確</span>';
          } else {
            resultElement.innerHTML = `<span class="incorrect">錯誤 正確答案是 ${correct.join(', ')}</span>`;
          }
        } else {
          const selected = document.querySelector(`input[name="${q.id}"]:checked`)?.value;
          if (selected === q.correct) {
            score++;
            resultElement.innerHTML = '<span class="correct">正確</span>';
          } else {
            resultElement.innerHTML = `<span class="incorrect">錯誤 正確答案是 ${q.correct}</span>`;
          }
        }
      });

      totalResult.innerHTML = `總得分：${score} / ${total}（${(score / total * 100).toFixed(2)}%）`;
    });
  </script>
</body>
